[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["bench/netbench"]

[workspace.package]
version = "0.2.1"
edition = "2021"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/xozy22/qross"
authors = ["DennisK"]

[workspace.dependencies]
qross-core = { path = "crates/qross-core" }
qross-net = { path = "crates/qross-net" }
qross-platform = { path = "crates/qross-platform" }
qross-proto = { path = "crates/qross-proto" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "7"
gethostname = "1"
if-addrs = "0.15"
postcard = { version = "1", features = ["use-std"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = "thin"

# Debug-Builds klein halten: Zeilennummern für eigene Crates, keine Debug-Info für
# Abhängigkeiten (Tauri & Co. belegen sonst schnell 20 GB).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
