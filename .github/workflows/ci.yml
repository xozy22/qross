name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2025
          - name: Linux
            # Bewusst die ältere LTS: Binaries laufen dann auch auf älteren Distributionen (glibc).
            os: ubuntu-24.04
          - name: macOS Apple Silicon
            os: macos-26
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Linux-Abhängigkeiten (Tauri, X11-Tests)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev xvfb

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        if: runner.os != 'Linux'
        run: cargo test --workspace --locked

      - name: Tests (mit virtuellem X-Server)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1280x800x24" cargo test --workspace --locked
