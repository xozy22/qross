name: Release

# Ein Release entsteht durch einen Tag, z. B.:
#   git tag v0.1.0 && git push origin v0.1.0
# oder manuell über „Run workflow“ mit einem bestehenden Tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Bestehender Tag, z. B. v0.1.0"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis
          - name: Linux x64
            # Ältere LTS für breite glibc-Kompatibilität der Pakete
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
          - name: macOS Apple Silicon
            os: macos-26
            target: aarch64-apple-darwin
            bundles: app,dmg
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - uses: actions/setup-node@v7
        with:
          node-version: latest

      - name: Linux-Abhängigkeiten (Tauri, X11-Tests)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev \
            patchelf file xvfb

      - name: Tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a -s "-screen 0 1280x800x24" cargo test --workspace --locked
          else
            cargo test --workspace --locked
          fi

      - name: Kommandozeile bauen
        run: cargo build --release --locked -p qross --target ${{ matrix.target }}

      - name: App bauen (Tauri)
        working-directory: crates/qross-gui
        run: npx --yes @tauri-apps/cli@2 build --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Artefakte sammeln
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG#v}"
          name="qross-${version}-${{ matrix.target }}"
          bin="target/${{ matrix.target }}/release"
          mkdir -p release "pkg/${name}"
          cp README.md LICENSE qross.example.toml "pkg/${name}/"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "${bin}/qross.exe" "pkg/${name}/"
            (cd pkg && 7z a -tzip "../release/${name}.zip" "${name}" > /dev/null)
          else
            cp "${bin}/qross" "pkg/${name}/"
            tar -czf "release/${name}.tar.gz" -C pkg "${name}"
          fi
          find "${bin}/bundle" -type f \( -name '*.msi' -o -name '*-setup.exe' -o -name '*.AppImage' \
            -o -name '*.deb' -o -name '*.dmg' \) -exec cp {} release/ \;
          ls -la release

      - uses: actions/upload-artifact@v7
        with:
          name: qross-${{ matrix.target }}
          path: release/*
          if-no-files-found: error

  publish:
    name: GitHub-Release veröffentlichen
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Prüfsummen
        run: |
          cd release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          name: Qross ${{ env.TAG }}
          generate_release_notes: true
          body: |
            ## Downloads

            | System | App | Kommandozeile |
            |---|---|---|
            | Windows x64 | `.msi` oder `-setup.exe` | `…-x86_64-pc-windows-msvc.zip` |
            | macOS Apple Silicon | `.dmg` | `…-aarch64-apple-darwin.tar.gz` |
            | Linux x64 | `.AppImage` oder `.deb` | `…-x86_64-unknown-linux-gnu.tar.gz` |

            Die Programme sind nicht signiert. Unter Windows zeigt SmartScreen beim ersten Start eine Warnung
            („Weitere Informationen → Trotzdem ausführen“). Unter macOS beim ersten Start per Rechtsklick → Öffnen
            starten und danach unter Datenschutz & Sicherheit „Bedienungshilfen“ und „Eingabeüberwachung“ erlauben.

            Prüfsummen: `SHA256SUMS.txt`
          files: release/*
