name: Release

# Ein Release entsteht durch einen Tag, z. B.:
#   git tag v0.1.0 && git push origin v0.1.0
# oder manuell über „Run workflow“ mit einem bestehenden Tag.
# Testlauf ohne Veröffentlichung: „Run workflow“ auf einem Branch mit „Testlauf“; gebaut und geprüft
# wird dann der Stand des Branches, der Tag liefert nur Version und Release-Notizen.
#   gh workflow run release.yml --ref <branch> -f tag=v0.5.0 -f test_run=true
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Bestehender Tag, z. B. v0.1.0"
        required: true
      test_run:
        description: "Testlauf: den gewählten Branch bauen und prüfen, nichts veröffentlichen"
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # Läuft zuerst, damit ein fehlender Changelog-Eintrag auffällt, bevor 20 Minuten gebaut wird.
  # Beim manuellen Start kommt der Changelog vom gewählten Branch, so lassen sich alte Releases neu beschreiben.
  notes:
    name: Release-Notizen aus dem Changelog
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Version prüfen
        if: github.event_name == 'push'
        run: |
          cargo_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [ "v${cargo_version}" != "${TAG}" ]; then
            echo "::error::Tag ${TAG} passt nicht zur Version ${cargo_version} in Cargo.toml"
            exit 1
          fi

      - name: Abschnitt aus CHANGELOG.md
        run: |
          bash tools/release-notes.sh "${TAG#v}" > release-notes.md
          NOTES_ONLY=1 bash tools/release-notes.sh "${TAG#v}" > changelog-section.md
          cat release-notes.md

      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: |
            release-notes.md
            changelog-section.md
            tools/latest_json.py
          if-no-files-found: error

  build:
    name: Build ${{ matrix.name }}
    needs: notes
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis
          - name: Linux x64
            # Ältere LTS für breite glibc-Kompatibilität der Pakete
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
          - name: macOS Apple Silicon
            os: macos-26
            target: aarch64-apple-darwin
            bundles: app,dmg
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.test_run && github.sha || env.TAG }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - uses: actions/setup-node@v7
        with:
          node-version: latest

      - name: Linux-Abhängigkeiten (Tauri, X11-Tests)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev \
            patchelf file xvfb

      - name: Tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a -s "-screen 0 1280x800x24" cargo test --workspace --locked
          else
            cargo test --workspace --locked
          fi

      - name: Kommandozeile bauen
        run: cargo build --release --locked -p qross --target ${{ matrix.target }}

      # Eigenes, selbst signiertes Zertifikat statt ad hoc: Die designierte Anforderung (Identifier und
      # Zertifikat) bleibt über Builds gleich, also behält macOS „Bedienungshilfen“ und
      # „Eingabeüberwachung“ nach einem Update. Ad hoc steckt darin der cdhash, der sich mit jedem Build
      # ändert. Tauris eigener Import (APPLE_CERTIFICATE) erkennt nur Zertifikate von Apple, deshalb
      # kommt es hier in eine eigene Keychain; signiert wird mit dem Namen aus bundle.macOS.signingIdentity.
      # Das Zertifikat erst nach Rückfrage austauschen: Mit einem neuen verlieren alle Mac-Nutzer die Rechte.
      - name: Signierzertifikat importieren (macOS)
        if: runner.os == 'macOS'
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${CERTIFICATE}" ]; then
            if [ "${{ inputs.test_run }}" != "true" ]; then
              echo "::error::Secret MACOS_CERTIFICATE fehlt – ad hoc signiert verlören Mac-Nutzer nach dem Update ihre Rechte"
              exit 1
            fi
            echo "::warning::Secret MACOS_CERTIFICATE fehlt – das App-Paket wird nur ad hoc signiert"
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            exit 0
          fi
          keychain="${RUNNER_TEMP}/qross-signing.keychain-db"
          password="$(openssl rand -hex 24)"
          printf '%s' "${CERTIFICATE}" | base64 --decode > "${RUNNER_TEMP}/qross-signing.p12"
          security create-keychain -p "${password}" "${keychain}"
          security set-keychain-settings -lut 3600 "${keychain}"
          security unlock-keychain -p "${password}" "${keychain}"
          security import "${RUNNER_TEMP}/qross-signing.p12" -k "${keychain}" -f pkcs12 \
            -P "${CERTIFICATE_PASSWORD}" -T /usr/bin/codesign
          rm "${RUNNER_TEMP}/qross-signing.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${password}" "${keychain}" > /dev/null
          security list-keychains -d user -s "${keychain}" $(security list-keychains -d user | tr -d '"')
          # Ohne -v: Ein selbst signiertes Zertifikat gilt dem System nicht als vertrauenswürdig,
          # codesign nimmt es trotzdem.
          security find-identity -p codesigning "${keychain}"

      # Mit dem Schlüssel entstehen zusätzlich die signierten Update-Pakete (*.sig) für den Updater der App.
      - name: App bauen (Tauri)
        working-directory: crates/qross-gui
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx --yes @tauri-apps/cli@2 build --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Signier-Keychain entfernen (macOS)
        if: always() && runner.os == 'macOS'
        run: security delete-keychain "${RUNNER_TEMP}/qross-signing.keychain-db" 2> /dev/null || true

      # Tauri signiert das DMG mit, sobald die Identität nicht „-“ ist. Ein signiertes, aber nicht
      # beglaubigtes DMG sperrt Gatekeeper aber schon beim Öffnen, vor der App darin
      # (https://github.com/tauri-apps/tauri/issues/12288). Ohne Signatur fragt macOS nur einmal, bei der App.
      # `codesign --remove-signature` kann das bei DMGs nicht; ein neu geschriebenes Abbild trägt keine
      # Signatur und behält Inhalt und Fensterlayout. Tauris DMG-Schritt ohne Identität ginge nicht: Er
      # baut dann das App-Paket neu und signiert es nur ad hoc.
      - name: DMG ohne Signatur neu schreiben (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          for dmg in target/${{ matrix.target }}/release/bundle/dmg/*.dmg; do
            codesign --display "$dmg" > /dev/null 2>&1 || continue
            hdiutil convert "$dmg" -format UDZO -imagekey zlib-level=9 -o "${dmg%.dmg}-neu.dmg" -quiet
            mv -f "${dmg%.dmg}-neu.dmg" "$dmg"
            echo "Ohne Signatur neu geschrieben: $dmg"
            hdiutil imageinfo "$dmg" | grep -E "^(Format|Software License Agreement):" || true
          done

      # Ohne gültige Signatur des ganzen App-Pakets meldet macOS nach dem Download „beschädigt“
      # statt „nicht verifizierter Entwickler“ (das sich in den Einstellungen freigeben lässt).
      - name: macOS-Signatur prüfen (App, DMG, Update-Paket)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          bundle="target/${{ matrix.target }}/release/bundle"
          app="${bundle}/macos/Qross.app"
          codesign --verify --deep --strict --verbose=2 "${app}"
          codesign --display --verbose=4 "${app}" 2>&1 \
            | grep -E "^(Identifier|Format|CodeDirectory|CDHash|Signature|Authority|TeamIdentifier|Sealed Resources)"
          # Designierte Anforderung: Daran bindet macOS die Rechte unter Datenschutz & Sicherheit.
          requirement="$(codesign --display -r- "${app}" 2> /dev/null)"
          echo "${requirement}"
          if [ "${APPLE_SIGNING_IDENTITY:-}" != "-" ] && ! grep -q 'certificate' <<< "${requirement}"; then
            echo "::error::App-Paket nicht mit dem Zertifikat signiert – Mac-Nutzer verlören bei jedem Update die Rechte"
            exit 1
          fi
          if codesign --display "${bundle}"/dmg/*.dmg > /dev/null 2>&1; then
            echo "::error::Das DMG ist signiert – Gatekeeper sperrte es schon beim Öffnen"
            exit 1
          fi
          mount="$(mktemp -d)"
          # Das DMG zeigt beim Öffnen die Lizenz; ohne Zustimmung bricht hdiutil das Einhängen ab.
          (yes || true) | hdiutil attach -nobrowse -readonly -mountpoint "$mount" "${bundle}"/dmg/*.dmg > /dev/null
          codesign --verify --deep --strict --verbose=2 "${mount}/Qross.app"
          spctl --assess --type execute --verbose=2 "${mount}/Qross.app" || true
          hdiutil detach "$mount" > /dev/null
          # Das Update-Paket enthält dasselbe App-Paket, das der Updater einspielt.
          update="$(mktemp -d)"
          tar -xzf "${bundle}/macos/Qross.app.tar.gz" -C "$update"
          codesign --verify --deep --strict --verbose=2 "${update}/Qross.app"

      - name: Artefakte sammeln
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG#v}"
          name="qross-${version}-${{ matrix.target }}"
          bin="target/${{ matrix.target }}/release"
          mkdir -p release "pkg/${name}"
          cp README.md LICENSE qross.example.toml "pkg/${name}/"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "${bin}/qross.exe" "pkg/${name}/"
            (cd pkg && 7z a -tzip "../release/${name}.zip" "${name}" > /dev/null)
          else
            cp "${bin}/qross" "pkg/${name}/"
            tar -czf "release/${name}.tar.gz" -C pkg "${name}"
          fi
          find "${bin}/bundle" -type f \( -name '*.msi' -o -name '*-setup.exe' -o -name '*.AppImage' \
            -o -name '*.deb' -o -name '*.dmg' -o -name '*.msi.sig' -o -name '*-setup.exe.sig' \
            -o -name '*.AppImage.sig' -o -name '*.deb.sig' \) -exec cp {} release/ \;
          # Update-Paket für macOS: das App-Bundle als tar.gz, mit Version im Namen (erst ab 0.4.0)
          if [ -f "${bin}/bundle/macos/Qross.app.tar.gz" ]; then
            for ext in app.tar.gz app.tar.gz.sig; do
              cp "${bin}/bundle/macos/Qross.${ext}" "release/Qross_${version}_aarch64.${ext}"
            done
          fi
          ls -la release

      - uses: actions/upload-artifact@v7
        with:
          name: qross-${{ matrix.target }}
          path: release/*
          if-no-files-found: error

  # Wie beim Nutzer: ein Mac, der das Zertifikat nie gesehen hat, mit dem DMG aus dem Release.
  macos-check:
    name: macOS-Paket auf frischem Mac prüfen
    needs: build
    runs-on: macos-26
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: qross-aarch64-apple-darwin
          path: release

      - name: Signatur und designierte Anforderung
        run: |
          set -euo pipefail
          codesign --display release/*.dmg 2>&1 || true
          mount="$(mktemp -d)"
          (yes || true) | hdiutil attach -nobrowse -readonly -mountpoint "$mount" release/*.dmg > /dev/null
          ditto "${mount}/Qross.app" check/Qross.app
          hdiutil detach "$mount" > /dev/null
          codesign --verify --deep --strict --verbose=2 check/Qross.app
          codesign --display --verbose=4 check/Qross.app 2>&1 \
            | grep -E "^(Identifier|CodeDirectory|CDHash|Signature|Authority|TeamIdentifier)"
          codesign --display -r- check/Qross.app 2> /dev/null

      # Wie macOS nach einem Update: Erfüllt die neue Version die designierte Anforderung der zuletzt
      # veröffentlichten? Nur dann gelten erteilte Rechte weiter (Apple TN3127).
      - name: Rechte bleiben nach dem Update erhalten
        run: |
          set -euo pipefail
          gh release download --repo "${{ github.repository }}" --pattern '*.dmg' --dir previous
          mount="$(mktemp -d)"
          (yes || true) | hdiutil attach -nobrowse -readonly -mountpoint "$mount" previous/*.dmg > /dev/null
          codesign --display -r previous.req "${mount}/Qross.app" 2> /dev/null
          hdiutil detach "$mount" > /dev/null
          sed -i '' -E 's/^#? *designated => //' previous.req
          echo "Letzte Version ($(ls previous)): $(cat previous.req)"
          if grep -q 'cdhash' previous.req; then
            echo "::notice::Die letzte Version ist nur ad hoc signiert. Mac-Nutzer müssen die Rechte nach diesem Update ein letztes Mal neu erteilen."
          elif codesign --verify --verbose=2 -R previous.req check/Qross.app; then
            echo "Die neue Version erfüllt die Anforderung der letzten: Die Rechte bleiben erhalten."
          else
            message="Die neue Version erfüllt die Anforderung der letzten nicht – Mac-Nutzer verlören nach dem Update ihre Rechte"
            if [ "${{ inputs.test_run }}" != "true" ]; then
              echo "::error::${message}"
              exit 1
            fi
            echo "::warning::${message}"
          fi

      # Startet die App kurz: Signatur und Hardened Runtime ohne Team-ID werden von macOS angenommen,
      # und die Rechteprüfung läuft auf echtem macOS.
      - name: Startprobe
        run: |
          # Der Runner startet Skripte mit bash -e; `wait` auf den beendeten Prozess liefert 143.
          set +e
          QROSS_DATA_DIR="$(mktemp -d)" check/Qross.app/Contents/MacOS/qross-gui > start.log 2>&1 &
          pid=$!
          sleep 15
          alive=no
          if kill -0 "$pid" 2> /dev/null; then
            alive=yes
            kill "$pid"
          fi
          wait "$pid" 2> /dev/null
          cat start.log
          if [ "$alive" != yes ]; then
            echo "::error::Qross hat sich beim Start beendet"
            exit 1
          fi

      # Gatekeeper wie nach einem Download aus dem Browser (Quarantäne-Attribut). Zum Vergleich die
      # bisherige Ad-hoc-Signatur (0.3.1 bis 0.5.0) und ein absichtlich beschädigtes Paket.
      - name: Gatekeeper-Vergleich
        continue-on-error: true
        timeout-minutes: 5
        run: |
          # Nur Diagnose: Ablehnungen sind hier das erwartete Ergebnis, nicht ein Fehler des Schritts.
          set +e
          spctl --status
          for variant in zertifikat adhoc beschaedigt; do
            ditto check/Qross.app "gatekeeper/${variant}/Qross.app"
          done
          codesign --force --deep --options runtime -s - gatekeeper/adhoc/Qross.app
          resource="$(find gatekeeper/beschaedigt/Qross.app/Contents/Resources -type f | head -n 1)"
          printf 'x' >> "$resource"
          for variant in zertifikat adhoc beschaedigt; do
            app="gatekeeper/${variant}/Qross.app"
            xattr -w com.apple.quarantine "0083;$(printf '%x' "$(date +%s)");Safari;" "$app"
            echo "==================== ${variant}"
            codesign --verify --deep --strict "$app" 2>&1 && echo "codesign: gültig"
            spctl --assess --type execute -vvv "$app" 2>&1
            # Nur Befunde und ihre Fehlertexte, ohne Vorschläge zur Abhilfe
            syspolicy_check distribution "$app" 2>&1 | grep -E "^[A-Z]|Full Error" | head -n 20
            # Echter erster Start: Gatekeeper entscheidet und zeigt seinen Dialog. Bis jemand ihn
            # beantwortet, hält macOS den Prozess an und `open` wartet – deshalb im Hintergrund.
            open "$app" > /dev/null 2>&1 &
            opener=$!
            sleep 8
            log show --last 10s --style compact \
              --predicate 'process == "syspolicyd" OR process == "CoreServicesUIAgent"' 2> /dev/null \
              | grep -i -E 'qross|prompt|malware|damaged|broken|verif|reject|allow|scan' | tail -n 25
            kill "$opener" 2> /dev/null
            pkill -f "gatekeeper/${variant}/Qross.app" 2> /dev/null
            killall CoreServicesUIAgent 2> /dev/null
            sleep 2
          done
          exit 0

  publish:
    name: GitHub-Release veröffentlichen
    needs: [notes, build, macos-check]
    if: ${{ !inputs.test_run }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: qross-*
          path: release
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          name: release-notes

      # Der Updater der App liest releases/latest/download/latest.json. Die Signaturen stecken
      # darin, die .sig-Dateien selbst braucht danach niemand mehr.
      - name: Update-Manifest (latest.json)
        shell: bash
        run: |
          set -euo pipefail
          if compgen -G "release/*.sig" > /dev/null; then
            python3 tools/latest_json.py --version "${TAG#v}" --repo "${{ github.repository }}" \
              --dir release --notes-file changelog-section.md > release/latest.json
            cat release/latest.json
            rm release/*.sig
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "::error::Keine signierten Update-Pakete – sind die Secrets TAURI_SIGNING_PRIVATE_KEY(_PASSWORD) gesetzt?"
            exit 1
          else
            echo "Ohne signierte Update-Pakete (älterer Tag) – kein latest.json"
          fi

      - name: Prüfsummen
        run: |
          cd release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          name: Qross ${{ env.TAG }}
          body_path: release-notes.md
          files: release/*
