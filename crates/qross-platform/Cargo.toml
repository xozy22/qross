[package]
name = "qross-platform"
description = "Betriebssystem-Anbindung von Qross: Eingaben abfangen, einspeisen, Clipboard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# Cursor-Finder: Rechnernamen mit einer Systemschrift zeichnen (reines Rust, auf allen Systemen gleich)
ab_glyph = "0.2"
anyhow.workspace = true
qross-core.workspace = true
qross-proto.workspace = true
png = "0.18"
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# screensaver: läuft der Bildschirmschoner? (XScreenSaver-Erweiterung)
# shape: Fenster des Cursor-Finders ohne Eingabebereich, Klicks gehen hindurch
# xfixes: Besitzwechsel von XdndSelection (laufendes Drag & Drop) mitbekommen
# xinput: Rohereignisse der Maus wecken die Erfassung (statt Abfragen im festen Takt)
x11rb = { version = "0.14", features = ["randr", "screensaver", "shape", "xfixes", "xinput", "xkb", "xtest"] }
# wayland-data-control: Zwischenablage ohne Fenster unter KDE, Sway, Hyprland; sonst über XWayland
arboard = { version = "3", default-features = false, features = ["image-data", "wayland-data-control"] }
# Markierungen der Passwortmanager unter Wayland lesen (dieselbe Version, die arboard mitbringt)
wl-clipboard-rs = "0.9"
# Wayland: Desktop-Portale (RemoteDesktop, InputCapture) und libei (reines Rust, keine C-Bibliotheken).
# „screencast“ braucht ashpd intern für remote_desktop; Qross nutzt keine Bildschirmübertragung.
ashpd = { version = "0.13", default-features = false, features = ["tokio", "remote_desktop", "input_capture", "screencast"] }
reis = { version = "0.7", features = ["tokio"] }
futures-util = "0.3"
# Monotone Uhr für die Zeitstempel von libei
rustix = { version = "1", features = ["time"] }
# Netlink-Socket: Netzwechsel melden (Systemereignisse)
libc = "0.2"

[dev-dependencies]
# Log der Beispiele (z. B. `--example finder`)
tracing-subscriber.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
x11rb = { version = "0.14", features = ["xfixes", "xtest"] }

[target.'cfg(target_os = "macos")'.dependencies]
arboard = { version = "3", default-features = false, features = ["image-data"] }
core-foundation = "0.10"
core-graphics = { version = "0.25", features = ["highsierra"] }
# Zeiger auf ein CGImage für den Layer des Cursor-Finders (dieselbe Version, die core-graphics nutzt)
foreign-types = "0.5"
# CPU und Arbeitsspeicher von Qross (libproc: proc_pid_rusage, Prozesslisten)
libc = "0.2"
# Medientasten (NX_SYSDEFINED) lassen sich nur über NSEvent erzeugen; Fenster des Cursor-Finders
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSColor", "NSEvent", "NSGraphics", "NSGraphicsContext", "NSPasteboard", "NSPasteboardItem", "NSResponder", "NSView", "NSWindow", "objc2-core-graphics"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGEvent", "CGEventTypes"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSFileManager", "NSGeometry", "NSProcessInfo", "NSString", "NSURL", "objc2-core-foundation"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
# Netzwerk für Profile je Ort: eigene Adresse und Präfix je Karte
if-addrs.workspace = true
# Schreibtisch-Ordner beim Ablegen, Datenverzeichnis unter Wayland
dirs.workspace = true

[target.'cfg(windows)'.dependencies]
# IpHelper: Netzwerkkarten, Gateway und dessen MAC für Profile je Ort
# Security, StationsAndDesktops, SystemInformation: Wächter für die Eingabe-Hooks
# Power: Ruhezustand und Aufwachen melden (Systemereignisse)
# Registry, Shutdown: Bildschirmschoner (eingerichtet? sperren)
# Diagnostics_ToolHelp, ProcessStatus: CPU und Arbeitsspeicher von Qross samt WebView2
# Wdk_System_Threading: Kommandozeilen der WebView2-Prozesse (welcher Art sie sind)
windows-sys = { workspace = true, features = ["Wdk_System_Threading", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Power", "Win32_System_ProcessStatus", "Win32_System_Registry", "Win32_System_Shutdown", "Win32_System_StationsAndDesktops", "Win32_System_SystemInformation"] }
# COM (Drag & Drop, Shell) – mit windows-sys nicht umsetzbar
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Networking_NetworkListManager",
    "Win32_System_Com",
    "Win32_System_Com_Marshal",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
# vom #[implement]-Makro vorausgesetzt
windows-core = "0.62"
