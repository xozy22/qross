[package]
name = "qross-platform"
description = "Betriebssystem-Anbindung von Qross: Eingaben abfangen, einspeisen, Clipboard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
anyhow.workspace = true
qross-core.workspace = true
qross-proto.workspace = true
png = "0.18"
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.14", features = ["randr", "xkb", "xtest"] }
arboard = { version = "3", default-features = false, features = ["image-data"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
x11rb = { version = "0.14", features = ["xtest"] }

[target.'cfg(target_os = "macos")'.dependencies]
arboard = { version = "3", default-features = false, features = ["image-data"] }
core-foundation = "0.10"
core-graphics = { version = "0.25", features = ["highsierra"] }
# Medientasten (NX_SYSDEFINED) lassen sich nur über NSEvent erzeugen
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSEvent", "NSGraphicsContext", "NSPasteboard", "NSPasteboardItem", "objc2-core-graphics"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGEvent", "CGEventTypes"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSGeometry", "NSString", "NSURL", "objc2-core-foundation"] }

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
# COM (Drag & Drop, Shell) – mit windows-sys nicht umsetzbar
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
# vom #[implement]-Makro vorausgesetzt
windows-core = "0.62"
