[package]
name = "qross-platform"
description = "Betriebssystem-Anbindung von Qross: Eingaben abfangen, einspeisen, Clipboard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# Cursor-Finder: Rechnernamen mit einer Systemschrift zeichnen (reines Rust, auf allen Systemen gleich)
ab_glyph = "0.2"
anyhow.workspace = true
qross-core.workspace = true
qross-proto.workspace = true
png = "0.18"
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# shape: Fenster des Cursor-Finders ohne Eingabebereich, Klicks gehen hindurch
x11rb = { version = "0.14", features = ["randr", "shape", "xkb", "xtest"] }
# wayland-data-control: Zwischenablage ohne Fenster unter KDE, Sway, Hyprland; sonst über XWayland
arboard = { version = "3", default-features = false, features = ["image-data", "wayland-data-control"] }
# Markierungen der Passwortmanager unter Wayland lesen (dieselbe Version, die arboard mitbringt)
wl-clipboard-rs = "0.9"
# Wayland: Desktop-Portale (RemoteDesktop, InputCapture) und libei (reines Rust, keine C-Bibliotheken).
# „screencast“ braucht ashpd intern für remote_desktop; Qross nutzt keine Bildschirmübertragung.
ashpd = { version = "0.13", default-features = false, features = ["tokio", "remote_desktop", "input_capture", "screencast"] }
reis = { version = "0.7", features = ["tokio"] }
dirs.workspace = true
futures-util = "0.3"
# Monotone Uhr für die Zeitstempel von libei
rustix = { version = "1", features = ["time"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
x11rb = { version = "0.14", features = ["xtest"] }

[target.'cfg(target_os = "macos")'.dependencies]
arboard = { version = "3", default-features = false, features = ["image-data"] }
core-foundation = "0.10"
core-graphics = { version = "0.25", features = ["highsierra"] }
# Zeiger auf ein CGImage für den Layer des Cursor-Finders (dieselbe Version, die core-graphics nutzt)
foreign-types = "0.5"
# Medientasten (NX_SYSDEFINED) lassen sich nur über NSEvent erzeugen; Fenster des Cursor-Finders
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSColor", "NSEvent", "NSGraphics", "NSGraphicsContext", "NSPasteboard", "NSPasteboardItem", "NSResponder", "NSView", "NSWindow", "objc2-core-graphics"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGEvent", "CGEventTypes"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSGeometry", "NSString", "NSURL", "objc2-core-foundation"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
# Netzwerk für Profile je Ort: eigene Adresse und Präfix je Karte
if-addrs.workspace = true

[target.'cfg(windows)'.dependencies]
# IpHelper: Netzwerkkarten, Gateway und dessen MAC für Profile je Ort
windows-sys = { workspace = true, features = ["Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"] }
# COM (Drag & Drop, Shell) – mit windows-sys nicht umsetzbar
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Networking_NetworkListManager",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
# vom #[implement]-Makro vorausgesetzt
windows-core = "0.62"
