[package]
name = "qross-platform"
description = "Betriebssystem-Anbindung von Qross: Eingaben abfangen, einspeisen, Clipboard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
anyhow.workspace = true
qross-core.workspace = true
qross-proto.workspace = true
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.14", features = ["xtest"] }
arboard = { version = "3", default-features = false }

[target.'cfg(target_os = "linux")'.dev-dependencies]
x11rb = { version = "0.14", features = ["xtest"] }

[target.'cfg(target_os = "macos")'.dependencies]
arboard = { version = "3", default-features = false }
core-foundation = "0.10"
core-graphics = { version = "0.25", features = ["highsierra"] }

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
# COM (Drag & Drop, Shell) – mit windows-sys nicht umsetzbar
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
# vom #[implement]-Makro vorausgesetzt
windows-core = "0.62"
