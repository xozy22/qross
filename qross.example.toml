# Qross – Server-Konfiguration
# Kopieren nach qross.toml und anpassen. Start: qross server

# Name dieses Rechners (Standard: Rechnername in Kleinbuchstaben)
name = "pc"

# UDP-Adresse, auf der der Server lauscht
listen = "0.0.0.0:24900"

# Anordnung der Bildschirme. Die Gegenrichtung wird automatisch ergänzt:
# „laptop rechts vom pc“ bedeutet auch „pc links vom laptop“.
# Kanten: left, right, top, bottom
[[links]]
from = "pc"
edge = "right"
to = "laptop"

# Weitere Rechner, z. B. ein Tablet über dem PC:
# [[links]]
# from = "pc"
# edge = "top"
# to = "tablet"

# Wann der Cursor wechselt (optional)
[switching]
# Ecken-Totzone in Pixeln: In den Ecken wird nicht gewechselt (Startmenü, Schließen-Knopf)
corner_size = 8
# So lange gegen die Kante drücken, bevor gewechselt wird (0 = sofort)
delay_ms = 0

# Zwischenablage (optional)
[clipboard]
# Kopierte Dateien (Strg+C im Explorer) bis zu dieser Gesamtgröße in MB beim Wechsel mitgeben,
# damit sie drüben mit Strg+V eingefügt werden können. Größeres per Drag & Drop ziehen. 0 = aus
max_file_mb = 1000

# Tasten (optional)
[keys]
# Taste oder Kombination, die den Cursor auf dem aktuellen Bildschirm festhält, z. B. für Spiele.
# Namen wie KeyboardEvent.code im Browser: "ScrollLock", "Ctrl+Alt+KeyL", "Pause" … Leer = aus
lock = "ScrollLock"
# Medientasten (Lautstärke, Wiedergabe): "active" = an den Rechner mit dem Cursor,
# "local" = immer auf diesem Rechner (z. B. weil hier die Lautsprecher hängen)
media = "active"

# Tasten je Rechner umbelegen: gedrückte Taste = gesendete Taste
# Beispiel: Am Mac Alt und Windows-Taste tauschen, damit Cmd dort liegt, wo am Mac Cmd ist
[keys.remap.laptop]
AltLeft = "MetaLeft"
